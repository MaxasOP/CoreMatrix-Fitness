<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>CoreMatrix</title>
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('cmTheme');
          if (!theme && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            theme = 'dark';
          }
          document.documentElement.dataset.theme = theme || 'light';
        } catch (e) {}
      })();
    </script>
    <!-- Tailwind via CDN for rapid, expressive styling (production: replace with proper build integration) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <meta name="theme-color" content="#f6f2ea">

    <!-- RESTORE TAILWIND CDN & BASE CLASSES TO FIX UI CHAOS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Space Grotesk', 'sans-serif'],
              display: ['Bebas Neue', 'sans-serif'],
            }
          }
        }
      }
    </script>
    <style type="text/tailwindcss">
      @layer components {
        .card { @apply bg-white border border-gray-100 rounded-2xl shadow-sm p-5; }
        .card-soft { @apply bg-gray-50 border border-gray-100 rounded-xl p-4; }
        .muted { @apply text-gray-500 font-medium; }
        .tag { @apply font-semibold text-gray-500 uppercase tracking-wide text-xs; }
        .reveal { animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) both; animation-delay: var(--d, 0s); }
      }
      @layer utilities {
        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
      }
      @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
